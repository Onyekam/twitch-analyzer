name: dbt Run

on:
  workflow_dispatch: {} # allows manual trigger
  schedule:
    - cron: "0 3 * * *" # optional: every day at 03:00 UTC

jobs:
  dbt-run:
    runs-on: ubuntu-latest
    environment: env

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # install dbt if not already in requirements.txt
          pip install dbt-core dbt-bigquery

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Write DBT Profile
        env:
          GOOGLE_APPLICATION_CREDENTIAL: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          mkdir -p ~/.dbt
          echo "$GOOGLE_APPLICATION_CREDENTIAL" | tr -d '\r' > ${{ github.workspace }}/gcp-creds.json
          # write dbt profile
          cat > ~/.dbt/profiles.yml <<'EOL'
          streamdata:
            target: dev
            outputs:
              dev:
                job_execution_timeout_seconds: 300
                job_retries: 1
                location: US
                priority: interactive
                type: bigquery
                method: service-account
                project: "{{ env_var('PROJECT_ID') }}"
                schema: "{{ env_var('DATASET_ID') }}"
                keyfile: "{{ env_var('GCP_KEYFILE') }}"
                threads: 4
          EOL

      - name: Run dbt
        env:
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          DATASET_ID: ${{ secrets.DATASET_ID }}
          GCP_KEYFILE: ${{ github.workspace }}/gcp-creds.json
        run: dbt run
