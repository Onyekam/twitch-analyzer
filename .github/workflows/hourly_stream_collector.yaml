name: Hourly Stream Collector

on:
  #schedule:
    #- cron: '0 * * * *'   # runs at the top of every hour (UTC)
  workflow_dispatch:       # allow manual trigger from Actions tab

# there were top level permissions here I had to remove
jobs:
  run-collector:
    runs-on: ubuntu-latest
    environment: env
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # or whatever version you use

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pynacl 

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Run stream_collector
        env:
          DATASET_ID: ${{ secrets.DATASET_ID }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          TABLE_ID: ${{ secrets.TABLE_ID }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          TWITCH_REDIRECT_URI: ${{ secrets.TWITCH_REDIRECT_URI }}
          TWITCH_TOKENS: ${{ secrets.TWITCH_TOKENS }}
          GH_PAT: ${{ secrets.GH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: python stream_collector.py

